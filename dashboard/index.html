<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="HRES — Heat Response Emergency System. AI-powered multi-agent operational command center for heat risk monitoring, verification, and emergency response coordination." />
  <title>HRES — Heat Response Emergency System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font load — eliminates CLS 0.53 and LCP render delay -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
  <style>
    /* Critical CSS — prevents FOUC, font fallback prevents CLS */
    html, body { background: #050b14; }
    body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    code, pre { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
</head>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
