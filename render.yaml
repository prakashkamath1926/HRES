services:
  - type: web
    name: hres-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hres-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      # You will need to manually add these secrets in the Render dashboard:
      # - RESEND_API_KEY
      # - JWT_SECRET
      # - ALLOWED_ORIGINS (Set to your Vercel URL)
      # - FORTYGUARD_API_KEY
      # - GEMINI_API_KEY
      # - KIRO_API_KEY
      # - GOOGLE_MAPS_API_KEY

databases:
  - name: hres-db
    plan: free
